# ─────────────────────────────────────────────────────────────────────────────
# Coolify production stack — app + PostgreSQL + Redis
#
# Use this file for a full-stack deployment in Coolify or any other Compose-
# based platform.
#
# The app builds from the production Dockerfile and connects to the internal
# postgres and redis services over the Compose network.
#
# Required env vars in Coolify:
#   API_KEY_SECRET
#
# Optional env vars:
#   LLM_PROVIDER, OPENAI_API_KEY, ANTHROPIC_API_KEY, MISTRAL_API_KEY,
#   XAI_API_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_BASE_URL
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gami_core
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gami_core']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -lc
      - >-
        psql postgresql://postgres:postgres@postgres:5432/gami_core
        -v ON_ERROR_STOP=1
        -f /schema/init.sql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    labels:
      - traefik.http.services.app.loadbalancer.server.port=3000
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gami_core
      REDIS_URL: redis://redis:6379
      API_KEY_SECRET: ${API_KEY_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LLM_PROVIDER: ${LLM_PROVIDER:-null}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
