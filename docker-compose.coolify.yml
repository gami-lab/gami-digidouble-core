# Coolify requires these environment variables:
#   API_KEY_SECRET
#   VITE_API_URL
#   VITE_API_KEY is derived from API_KEY_SECRET for the web build
#   ADMIN_PASSWORD_HASH (pnpm --filter @gami/core hash-admin-password)
#   ADMIN_SESSION_SECRET, ADMIN_SERVICE_KEY (at least 32 characters each)
#   ADMIN_ORIGINS (origin of the admin app, e.g. https://app.example.com)
#   PLAYER_TOKEN_SECRET (at least 32 characters)
#   PLAYER_ORIGINS (origin of the player web app, e.g. https://app.example.com)
# Optional: TRUST_PROXY_HOPS (default 1, the Coolify/Traefik hop), RATE_LIMIT_<POLICY>=<max>/<seconds>
#
# The default embedding provider requires OPENAI_API_KEY at startup.
# Optional env vars:
#   LLM_PROVIDER, EMBEDDING_PROVIDER, EMBEDDING_MODEL, EMBEDDING_DIMENSIONS,
#   EMBEDDING_BATCH_SIZE, ANTHROPIC_API_KEY, MISTRAL_API_KEY,
#   XAI_API_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_BASE_URL
services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gami_core
    volumes:
      - postgres_data_canonical:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gami_core']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -lc
      - >-
        psql postgresql://postgres:postgres@postgres:5432/gami_core
        -v ON_ERROR_STOP=1
        -f /schema/init.sql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    labels:
      - traefik.http.services.app.loadbalancer.server.port=3000
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gami_core
      REDIS_URL: redis://redis:6379
      API_KEY_SECRET: ${API_KEY_SECRET}
      PLAYER_ORIGINS: ${PLAYER_ORIGINS:?}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?}
      ADMIN_SERVICE_KEY: ${ADMIN_SERVICE_KEY:?}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      ADMIN_ORIGINS: ${ADMIN_ORIGINS:?}
      PLAYER_TOKEN_SECRET: ${PLAYER_TOKEN_SECRET:?}
      LLM_PROVIDER: ${LLM_PROVIDER:-null}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-100}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      DEEPGRAM_TIMEOUT_MS: ${DEEPGRAM_TIMEOUT_MS:-30000}
      DEEPGRAM_DEFAULT_LANGUAGE: ${DEEPGRAM_DEFAULT_LANGUAGE:-en}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:?}
        VITE_API_KEY: ${API_KEY_SECRET:?}
    restart: unless-stopped
    expose:
      - '80'
    labels:
      - traefik.enable=true
      - traefik.http.services.web.loadbalancer.server.port=80
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        VITE_API_URL: ${VITE_API_URL:?}
    restart: unless-stopped
    expose:
      - '80'
    labels:
      - traefik.enable=true
      - traefik.http.services.admin.loadbalancer.server.port=80
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data_canonical:
  redis_data:
