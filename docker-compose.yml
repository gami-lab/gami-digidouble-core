# After schema changes, recreate the canonical volume before starting services:
#     docker compose down
#     docker volume rm gami-digidouble-core_postgres_data_canonical 2>/dev/null || true
#     docker compose up -d postgres redis

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: gami_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gami_core
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_canonical:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gami_core']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gami_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gami_app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gami_core
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    volumes:
      # Mount source for hot reload — exclude node_modules
      - .:/app
      - /app/node_modules
      - /app/apps/core/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data_canonical:
  redis_data:
